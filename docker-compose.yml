services:
  db:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: saas-starter-kit
    ports:
      - 5432:5432

  # S3-compatible object storage for resumes (development)
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/resumes;
      mc anonymous set none local/resumes;
      "

  # Background worker (interview reminders, scheduled jobs, offer expiry).
  # Start with:  docker compose --profile worker up -d worker
  worker:
    image: node:22-alpine
    profiles: ['worker']
    working_dir: /app
    volumes:
      - .:/app:ro
    command: node worker/index.js
    environment:
      APP_URL: http://host.docker.internal:4002
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      TICK_SECONDS: 60
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  minio-data:
