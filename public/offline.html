<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3346D3" />
    <title>You are offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f7f8fa;
        color: #0f172a;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #475467;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        min-height: 48px;
        padding: 0 20px;
        border-radius: 12px;
        border: 0;
        background: #3346d3;
        color: #fff;
        font:
          600 15px system-ui,
          sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        We could not reach the server. Job pages you opened recently still work.
        Your applications and the recruiter tools need a connection.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
